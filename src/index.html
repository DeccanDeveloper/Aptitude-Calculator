<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Aptitude Calculator</h1>
    <div id="calculator">
        <label>
            Number of Questions:
            <input type="number" id="total" min="0" />
        </label>
        <label>
            Correct Answers:
            <input type="number" id="correct" min="0" />
        </label>
        <label>
            Wrong Answers:
            <input type="number" id="wrong" min="0" />
        </label>
        <label>
            Negative Marking per Wrong Answer:
            <input type="number" id="negative" min="0" step="0.01" value="0.25" />
        </label>
        <button id="calculate">Calculate Score</button>
    </div>
    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
